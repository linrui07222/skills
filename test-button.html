<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .btn { background: #f59e0b; color: #000; border: none; padding: 20px 40px; font-size: 24px; font-weight: bold; border-radius: 12px; cursor: pointer; }
        .btn:hover { background: #fbbf24; }
        #result { margin-top: 30px; font-size: 20px; color: #4ade80; }
    </style>
</head>
<body>
    <div style="text-align:center">
        <button class="btn" onclick="document.getElementById('result').innerText='成功了！按钮可以点击！'">点我测试</button>
        <div id="result"></div>
    </div>
</body>
</html>
